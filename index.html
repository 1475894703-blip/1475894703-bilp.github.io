<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>给bb的情书</title>
<meta name="description" content="❤️ 送给最特别的你">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important;overflow:hidden}
body{background:#0d0d0d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh;min-height:100dvh}

/* ===== 封面信封 ===== */
#coverPage{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d0d0d;transition:opacity 1.2s ease}
#coverPage.hidden{opacity:0;pointer-events:none}

.envelope-wrap{position:relative;width:260px;height:180px;perspective:800px;cursor:pointer}
.envelope{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 0.6s ease}

/* 信封主体 */
.envelope-body{position:absolute;inset:0;background:linear-gradient(135deg,#ff416c,#ff4b2b);border-radius:0 0 12px 12px;box-shadow:0 10px 40px rgba(255,65,108,0.4),0 0 60px rgba(255,75,43,0.2);z-index:2}
.envelope-body::after{content:"";position:absolute;bottom:0;left:0;right:0;height:50%;background:rgba(0,0,0,0.08);border-radius:0 0 12px 12px}

/* 信封盖子 */
.envelope-flap{position:absolute;top:0;left:0;width:100%;height:55%;background:linear-gradient(135deg,#ff5a7f,#ff6b4a);clip-path:polygon(0 0,50% 100%,100% 0);transform-origin:top;transition:transform 0.8s cubic-bezier(0.4,0,0.2,1);z-index:4;box-shadow:0 4px 15px rgba(0,0,0,0.2)}

/* 信纸 */
.letter{position:absolute;top:10px;left:10px;right:10px;bottom:10px;background:#fff;border-radius:8px;z-index:1;transform:translateY(0);transition:transform 1s cubic-bezier(0.34,1.56,0.64,1),opacity 0.6s ease;overflow:hidden}
.letter-content{padding:20px;text-align:center;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.letter-content h1{font-size:22px;color:#ff416c;margin-bottom:8px;font-weight:700;letter-spacing:4px}
.letter-content p{font-size:13px;color:#888;line-height:1.8}
.letter-seal{position:absolute;bottom:15px;right:20px;width:36px;height:36px;background:linear-gradient(135deg,#ff416c,#ff4b2b);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;box-shadow:0 2px 10px rgba(255,65,108,0.4)}

/* 打开状态 */
.envelope-wrap.open .envelope-flap{transform:rotateX(180deg)}
.envelope-wrap.open .letter{transform:translateY(-140px);z-index:5}

.cover-hint{color:rgba(255,255,255,0.5);font-size:13px;margin-top:30px;letter-spacing:2px;animation:floatHint 2s ease-in-out infinite}
@keyframes floatHint{0%,100%{opacity:0.5;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}

/* 信封上的文字 */
.envelope-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,0.9);font-size:18px;font-weight:700;letter-spacing:6px;z-index:3;text-shadow:0 2px 8px rgba(0,0,0,0.2)}

/* ===== 爱心页面 ===== */
#lovePage{position:fixed;inset:0;z-index:100;opacity:0;pointer-events:none;transition:opacity 1s ease;overflow-y:auto;-webkit-overflow-scrolling:touch}
#lovePage.active{opacity:1;pointer-events:auto}

#bgCanvas{position:fixed;left:0;top:0;width:100%;height:100%;z-index:1}
#explodeCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:50;pointer-events:none}

.main-wrapper{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px 20px;min-height:100vh}

.heart-wrapper{position:relative;width:160px;height:160px;animation:beat 1.2s infinite ease-in-out;cursor:pointer;pointer-events:auto}
.heart{position:absolute;width:100px;height:100px;background:linear-gradient(135deg,#ff416c,#ff4b2b);transform:rotate(-45deg);left:30px;top:45px;box-shadow:0 0 40px rgba(255,65,108,0.8),0 0 80px rgba(255,75,43,0.4)}
.heart::before,.heart::after{content:"";position:absolute;width:100px;height:100px;background:inherit;border-radius:50%}
.heart::before{top:-50px;left:0}
.heart::after{top:0;right:-50px}
.text{position:absolute;width:100%;height:100%;display:flex;justify-content:center;align-items:center;font-size:38px;font-weight:800;color:#fff;letter-spacing:2px;text-shadow:0 2px 10px rgba(0,0,0,0.4);z-index:3;transform:translateY(-8px);pointer-events:none}
.hint{color:rgba(255,255,255,0.5);font-size:13px;letter-spacing:1px}

/* 照片墙 */
.wall-title{color:rgba(255,255,255,0.7);font-size:14px;letter-spacing:3px;margin-top:10px;text-align:center}
.photo-wall{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:340px;margin-top:6px}
.photo-item{width:100px;height:100px;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,0.15);box-shadow:0 4px 15px rgba(0,0,0,0.4);transition:transform 0.3s ease,border-color 0.3s ease;cursor:pointer;position:relative;background:#1a1a1a}
.photo-item:active{transform:scale(1.08);border-color:rgba(255,105,180,0.6)}
.photo-item img{width:100%;height:100%;object-fit:cover;display:block}

/* 大图预览 */
.lightbox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:300;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity 0.3s ease}
.lightbox.active{display:flex;opacity:1}
.lightbox img{max-width:90%;max-height:80vh;border-radius:12px;box-shadow:0 0 40px rgba(255,105,180,0.3)}
.lightbox-close{position:absolute;top:20px;right:20px;color:#fff;font-size:32px;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,0.1)}

@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes heartbeat{
  0%,100%{transform:scale(1)}
  15%{transform:scale(1.25)}
  30%{transform:scale(1)}
  45%{transform:scale(1.25)}
  60%{transform:scale(1)}
  75%{transform:scale(1.15)}
}
</style>
</head>

</div>

<!-- 大图预览 -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-close" id="lightboxClose">×</div>
  <img id="lightboxImg" src="" alt="">
</div>

<script>
/* ===== 封面打开动画 ===== */
const envelope = document.getElementById('envelope');
const coverPage = document.getElementById('coverPage');
const lovePage = document.getElementById('lovePage');
let opened = false;

envelope.addEventListener('click', function(){
  if(opened) return;
  opened = true;
  envelope.classList.add('open');
  setTimeout(()=>{
    coverPage.classList.add('hidden');
    setTimeout(()=>{
      lovePage.classList.add('active');
      // 自动来一次小爆炸
      const rect = document.getElementById('heartBtn').getBoundingClientRect();
      createExplosion(rect.left + rect.width/2, rect.top + rect.height/2);
    },400);
  },1200);
});

/* ===== 背景粒子 ===== */
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;
let W = window.innerWidth, H = window.innerHeight;

function resizeBg(){
  W = window.innerWidth; H = window.innerHeight;
  bgCanvas.width = W*dpr; bgCanvas.height = H*dpr;
  bgCanvas.style.width = W+'px'; bgCanvas.style.height = H+'px';
  bgCtx.setTransform(dpr,0,0,dpr,0,0);
}
resizeBg();
window.addEventListener('resize', resizeBg);

const bgParticles = [];
for(let i=0;i<60;i++){
  bgParticles.push({
    x:Math.random()*W, y:Math.random()*H,
    size:Math.random()*3+1,
    speedX:(Math.random()-0.5)*0.8,
    speedY:(Math.random()-0.5)*0.8-0.5,
    opacity:Math.random()*0.7+0.3
  });
}
function drawBg(){
  bgCtx.clearRect(0,0,W,H);
  for(const p of bgParticles){
    bgCtx.beginPath();
    bgCtx.arc(p.x,p.y,p.size,0,Math.PI*2);
    bgCtx.fillStyle = `rgba(255,105,180,${p.opacity})`;
    bgCtx.shadowBlur=10; bgCtx.shadowColor='#ff69b4';
    bgCtx.fill();
    p.x+=p.speedX; p.y+=p.speedY;
    if(p.y<0)p.y=H; if(p.x<0)p.x=W; if(p.x>W)p.x=0;
  }
  requestAnimationFrame(drawBg);
}
drawBg();

/* ===== 爆炸粒子 ===== */
const exCanvas = document.getElementById('explodeCanvas');
const exCtx = exCanvas.getContext('2d');
let eW = window.innerWidth, eH = window.innerHeight;
function resizeEx(){
  eW = window.innerWidth; eH = window.innerHeight;
  exCanvas.width = eW*dpr; exCanvas.height = eH*dpr;
  exCanvas.style.width = eW+'px'; exCanvas.style.height = eH+'px';
  exCtx.setTransform(dpr,0,0,dpr,0,0);
}
resizeEx();
window.addEventListener('resize', resizeEx);

const explosions = [];
const colors = ['#ff416c','#ff4b2b','#ff69b4','#ff8c00','#ffd700','#ff1493','#ff6b6b','#ffa07a'];

function createExplosion(x,y){
  for(let i=0;i<50;i++){
    const angle = Math.random()*Math.PI*2;
    const speed = Math.random()*6+2;
    explosions.push({
      x:x,y:y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      size:Math.random()*5+2,
      color:colors[Math.floor(Math.random()*colors.length)],
      alpha:1,
      decay:Math.random()*0.02+0.015,
      gravity:0.15,
      type:Math.random()>0.5?'circle':'heart'
    });
  }
  for(let i=0;i<10;i++){
    const angle = Math.random()*Math.PI*2;
    const speed = Math.random()*4+1;
    explosions.push({
      x:x,y:y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed-1,
      size:Math.random()*8+4,
      color:'#ff416c',
      alpha:1,
      decay:0.012,
      gravity:0.08,
      type:'heart'
    });
  }
}

function drawHeartShape(ctx,x,y,size,color,alpha){
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle=color; ctx.globalAlpha=alpha;
  ctx.beginPath();
  const t=size*0.3;
  ctx.moveTo(0,t);
  ctx.bezierCurveTo(0,0,-size/2,0,-size/2,t);
  ctx.bezierCurveTo(-size/2,(size+t)/2,0,size,0,size);
  ctx.bezierCurveTo(0,size,size/2,(size+t)/2,size/2,t);
  ctx.bezierCurveTo(size/2,0,0,0,0,t);
  ctx.fill(); ctx.restore();
}

function drawExplosions(){
  exCtx.clearRect(0,0,eW,eH);
  for(let i=explosions.length-1;i>=0;i--){
    const p=explosions[i];
    exCtx.globalAlpha=p.alpha;
    if(p.type==='heart'){
      drawHeartShape(exCtx,p.x,p.y,p.size,p.color,p.alpha);
    }else{
      exCtx.beginPath();
      exCtx.arc(p.x,p.y,p.size,0,Math.PI*2);
      exCtx.fillStyle=p.color;
      exCtx.shadowBlur=8; exCtx.shadowColor=p.color;
      exCtx.fill();
    }
    p.x+=p.vx; p.y+=p.vy;
    p.vy+=p.gravity;
    p.alpha-=p.decay;
    p.size*=0.985;
    if(p.alpha<=0)explosions.splice(i,1);
  }
  exCtx.globalAlpha=1;
  requestAnimationFrame(drawExplosions);
}
drawExplosions();

/* 点击爱心爆炸 */
document.getElementById('heartBtn').addEventListener('click',function(e){
  const rect=this.getBoundingClientRect();
  createExplosion(rect.left+rect.width/2, rect.top+rect.height/2);
  // 连续心跳3下
  this.style.animation='none';
  this.offsetHeight;
  this.style.animation='heartbeat 0.9s ease-in-out';
  setTimeout(()=>{this.style.animation='beat 1.2s infinite ease-in-out'},900);
});

/* ===== 照片预览 ===== */
document.querySelectorAll('.photo-item').forEach(item=>{
  item.addEventListener('click',()=>{
    const img=item.querySelector('img');
    if(img){
      document.getElementById('lightboxImg').src=img.src;
      document.getElementById('lightbox').classList.add('active');
    }
  });
});
document.getElementById('lightboxClose').addEventListener('click',()=>{
  document.getElementById('lightbox').classList.remove('active');
});
document.getElementById('lightbox').addEventListener('click',e=>{
  if(e.target.id==='lightbox')document.getElementById('lightbox').classList.remove('active');
});
</script>
</body>
</html>
